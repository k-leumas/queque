name: Release

on:
  push:
    branches:
      - main
      - beta

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh jq

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install release dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh jq

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Version & GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Publish to npm
        # Uses OIDC Trusted Publishing — no NPM_TOKEN secret needed.
        # Configure at npmjs.com → @k-leumas/queque-cli → Settings → Trusted Publishing:
        #   owner: k-leumas  repo: queque  workflow: release.yaml  environment: (blank)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --provenance --access public
