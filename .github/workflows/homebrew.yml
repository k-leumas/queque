name: Update Homebrew Tap

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # Required secret: HOMEBREW_TAP_TOKEN
  # Create a GitHub Personal Access Token with `repo` scope on k-leumas/homebrew-tap.
  # Add it to this repo: Settings → Secrets → Actions → New repository secret.
  #
  # Triggered via workflow_run (not release: published) because GitHub blocks
  # release events from firing when the release is created by GITHUB_TOKEN.
  homebrew:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Release to Homebrew tap
        uses: Justintime50/homebrew-releaser@v1
        with:
          homebrew_owner: k-leumas
          homebrew_tap: homebrew-tap
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          commit_owner: k-leumas
          commit_email: samuelkimama@protonmail.com
          install: |
            system "npm", "install", "--ignore-scripts", "--loglevel=error"
            system "node_modules/.bin/tsup"
            system "npm", "install", *std_npm_args, "--loglevel=error"
            bin.install_symlink libexec/"lib/node_modules/@k-leumas/queque-cli/dist/cli/main.js" => "qq"
            (share/"queque").install "shell/zsh/queque.zsh"
          test: |
            assert_match "queque", shell_output("#{bin}/qq --version")
          depends_on: |
            "node"
            "jq"
          formula_includes: |
            def caveats
              <<~EOS
                To enable the ?? trigger, add the shell integration to your .zshrc:
                  qq init zsh >> ~/.zshrc
                  source ~/.zshrc
                Then set your Anthropic API key:
                  export ANTHROPIC_API_KEY="sk-ant-..."
              EOS
            end
          formula_folder: Formula
          skip_commit: false
