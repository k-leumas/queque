name: Update Homebrew Tap

on:
  workflow_dispatch:

jobs:
  # Required secret: HOMEBREW_TAP_TOKEN
  # Create a GitHub Personal Access Token with `repo` scope on k-leumas/homebrew-tap.
  # Add it to this repo: Settings → Secrets → Actions → New repository secret.
  #
  # Manual fallback. Normal release publishing runs in release.yaml so npm and
  # Homebrew can publish in parallel after semantic-release.
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Resolve package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing Homebrew formula
        id: formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FORMULA_URL="https://raw.githubusercontent.com/k-leumas/homebrew-tap/main/Formula/queque.rb"
          if ! FORMULA="$(curl -fsSL "$FORMULA_URL")"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Homebrew formula not found or unavailable; publishing queque $VERSION."
            exit 0
          fi

          if printf '%s\n' "$FORMULA" | grep -F "v$VERSION" >/dev/null \
            || printf '%s\n' "$FORMULA" | grep -F "version \"$VERSION\"" >/dev/null \
            || printf '%s\n' "$FORMULA" | grep -F "version '$VERSION'" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Homebrew formula already references queque $VERSION; treating as idempotent success."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Homebrew formula exists but does not reference queque $VERSION; publishing update."
          fi

      - name: Release to Homebrew tap
        if: steps.formula.outputs.exists != 'true'
        uses: Justintime50/homebrew-releaser@v1
        with:
          homebrew_owner: k-leumas
          homebrew_tap: homebrew-tap
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          commit_owner: k-leumas
          commit_email: samuelkimama@protonmail.com
          install: |
            system "npm", "install", "--ignore-scripts", "--loglevel=error"
            system "node_modules/.bin/tsup"
            system "npm", "install", *std_npm_args, "--loglevel=error"
            bin.install_symlink libexec/"lib/node_modules/@k-leumas/queque-cli/dist/cli/main.js" => "qq"
            (share/"queque").install "shell/zsh/queque.zsh"
          test: |
            assert_match "queque", shell_output("#{bin}/qq --version")
          depends_on: |
            "node"
            "jq"
          formula_includes: |
            def caveats
              <<~EOS
                ==> Get started with queque

                  Step 1 — activate the ?? trigger:
                    qq init zsh >> ~/.zshrc && source ~/.zshrc

                  Step 2 — add your Anthropic API key to ~/.zshrc:
                    export ANTHROPIC_API_KEY="sk-ant-..."

                  Then open a new terminal and try:
                    git log??
              EOS
            end
          formula_folder: Formula
          skip_commit: false
